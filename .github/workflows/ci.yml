name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mentio
          POSTGRES_PASSWORD: mentio
          POSTGRES_DB: mentio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mentio" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://mentio:mentio@localhost:5432/mentio_test?schema=public
      DATABASE_URL: postgresql://mentio:mentio@localhost:5432/mentio_test?schema=public
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Applies the real migrations to the empty test DB, then runs the suite.
      - run: npm test
      - run: npm run build
